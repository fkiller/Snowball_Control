  [5,6,7].forEach(i=>{grid.children[i].dataset.selected='true';});
  if(editing!==undefined){
   const b=grid.children[editing],label=actions[editing].label;
   b.dataset.editing='true';b.setAttribute('aria-current','true');
   const badge=document.createElement('span');badge.className='editing-label';badge.textContent='Editing';b.appendChild(badge);
   b.setAttribute('aria-label',label+' · Editing');
   root.querySelector('.context').textContent='Editing '+label+' · '+(s.project||'')+' / '+(s.session||'');
  }
 }
}
for(let i=0;i<20;i++){const b=document.createElement('button');b.type='button';b.className='key';b.dataset.key=i;b.addEventListener('pointerdown',e=>{pressed=generation;if(actions[i].talk&&!b.disabled){b.setPointerCapture(e.pointerId);record(true)}});b.addEventListener('pointerup',()=>{if(actions[i].talk&&s.recording)record(false)});b.addEventListener('pointercancel',()=>{s.recording=false;s.status='Capture interrupted; nothing sent.';render()});b.addEventListener('click',()=>{if(pressed!==null&&pressed!==generation){pressed=null;return}pressed=null;if(!actions[i].off&&!actions[i].talk)actions[i].fn?.()});b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){pressed=generation;if(actions[i].talk&&!b.disabled){e.preventDefault();record(true)}}});b.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&actions[i].talk){e.preventDefault();if(s.recording)record(false)}});grid.appendChild(b)}
root.querySelectorAll('[data-knob]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.knob;if(k==='mute'){s.mute=!s.mute;render();return}if(k==='quieter'||k==='louder'){s.volume=Math.max(0,Math.min(100,s.volume+(k==='louder'?5:-5)));render();return}if(s.recording)return;if(s.modal){modalKnob(k);return}if(s.view==='answer'&&s.request){if(k!=='open'){s.answerOffset=Math.max(0,Math.min(Math.max(0,s.request.options.length-3),(s.answerOffset||0)+(k==='down'?1:-1)));generation++;render()}return}if(k==='open'){if(list().length)pick(list()[s.index]);else if(s.view==='session'&&s.request)enter('answer');return}const d=k==='down'?1:-1;generation++;if(list().length)s.index=Math.max(0,Math.min(list().length-1,s.index+d));else if(s.view==='session')s.page=Math.max(0,Math.min(2,s.page+d));render()}));root.querySelector('#sc-event').addEventListener('change',e=>{if(e.target.value==='session'){s.request=null;home()}else request(e.target.value)});remember();render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(design,'largeText',{label:'Larger reader text'})}
})();
